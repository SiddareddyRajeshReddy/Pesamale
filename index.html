<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLED Admiration Reel</title>
<style>
body{margin:0;min-height:100vh;box-sizing:border-box;background:#0d0d10;color:#cde;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}#bg{position:fixed;inset:0;z-index:-1;width:100vw;height:100vh;background:#000}
.board{background:#143c80;padding:16px 16px 12px;border-radius:10px;box-shadow:0 10px 40px #000a}
.pins{display:flex;justify-content:center;gap:24px;font:700 13px Georgia,serif;color:#dfe;margin-bottom:8px}
canvas{cursor:pointer;display:block;width:min(86vw,640px);aspect-ratio:2/1;background:#000;border:6px solid #1b1b1b;border-radius:4px}
.panel{width:min(92vw,640px);display:grid;gap:10px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{background:#1d2a3a;color:#9ff;border:1px solid #356;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:#27405a}
textarea{width:100%;height:150px;background:#10161e;color:#bfe;border:1px solid #356;border-radius:6px;padding:8px;font:13px monospace;box-sizing:border-box}
input[type=number]{width:60px;background:#10161e;color:#bfe;border:1px solid #356;border-radius:6px;padding:5px}
small{color:#89a}
</style></head><body>
<canvas id="bg"></canvas>

<div class="board">
  <div class="pins"><span>GND</span><span>VDD</span><span>SCK</span><span>SDA</span></div>
  <canvas id="oled" width="640" height="320"></canvas>
</div>

<!-- <small>Tap the screen to play / pause &middot; put <b>pesamale.mp3</b> next to this file for sound</small> -->
<script>
const W=128,H=64,S=5,$=id=>document.getElementById(id);
const o=$('oled').getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const b=buf.getContext('2d',{willReadFrequently:true});
const rnd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};

/* ---------- display ---------- */
function present(){
  const d=b.getImageData(0,0,W,H).data;
  o.fillStyle='#000';o.fillRect(0,0,640,320);o.fillStyle='#5ff';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4]>110)o.fillRect(x*S,y*S,S-1,S-1);
}
function clear(inv){
  b.fillStyle=inv?'#fff':'#000';b.fillRect(0,0,W,H);
  b.fillStyle=b.strokeStyle=inv?'#000':'#fff';
  b.lineWidth=1.2;b.lineCap='round';b.lineJoin='round';
}
const L=(...p)=>{b.beginPath();b.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)b.lineTo(p[i],p[i+1]);b.stroke()};
const dot=(x,y,r=0.7)=>{b.beginPath();b.arc(x,y,r,0,7);b.fill()};

/* ---------- scenes ---------- */
function stars(t,n=30){for(let i=0;i<n;i++)if(Math.sin(t*3+i*5)>-.2)b.fillRect((rnd(i)*W)|0,(rnd(i+99)*H)|0,1,1)}

/* real moon picture -> rotating 1-bit pixel moon (ordered dithering) */
const MOON_SPIN=.3; /* set to 0 for a still moon */
const MD=60,BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
let moonSrc=null,moonS=0,moonCX=0,moonCY=0,moonR=0,moonLL=null;
function processMoon(img){
  const S=img.width,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,S,S).data;moonSrc=new Float32Array(S*S);
  for(let i=0;i<S*S;i++)moonSrc[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  moonS=S;moonCX=S*177.5/360;moonCY=S*179.5/360;moonR=S*146/360;
  moonLL=new Float32Array(MD*MD*3);
  for(let y=0;y<MD;y++)for(let xx=0;xx<MD;xx++){
    const nx=(xx+.5-MD/2)/(MD/2),ny=(y+.5-MD/2)/(MD/2),r2=nx*nx+ny*ny,k=(y*MD+xx)*3;
    if(r2>1){moonLL[k+2]=-1;continue}
    const z=Math.sqrt(1-r2);moonLL[k]=Math.atan2(nx,z);moonLL[k+1]=Math.asin(ny);moonLL[k+2]=z;
  }
}
function moon(t,age){
  clear();stars(t,40);
  const cy=Math.round(32+(1-Math.min(1,age/2))*24),cx=64-MD/2,y0=cy-MD/2;
  b.fillStyle='#000';b.beginPath();b.arc(64,cy,MD/2+1,0,7);b.fill();b.fillStyle='#fff';
  if(!moonSrc){b.beginPath();b.arc(64,cy,MD/2,0,7);b.fill();return}
  const ang=t*MOON_SPIN,P=Math.PI;
  for(let y=0;y<MD;y++)for(let x=0;x<MD;x++){
    const k=(y*MD+x)*3,z=moonLL[k+2];if(z<0)continue;
    let u=((moonLL[k]+ang+P/2)%(2*P)+2*P)%(2*P);if(u>P)u=2*P-u;
    const lon=u-P/2,lat=moonLL[k+1];
    const sx=(moonCX+moonR*Math.cos(lat)*Math.sin(lon))|0,sy=(moonCY+moonR*Math.sin(lat))|0;
    let v=Math.min(1,Math.max(0,(moonSrc[sy*moonS+sx]-55)/150));v=Math.pow(v,.9)*(.6+.4*z);
    if(v>(BAY[(y&3)*4+(x&3)]+.5)/16)b.fillRect(cx+x,y0+y,1,1);
  }
  b.lineWidth=1;b.beginPath();b.arc(64,cy,MD/2-.5,0,7);b.stroke();
}

function lotus(t,age){
  clear();stars(t,14);
  const g=Math.min(1,age/1.5);
  for(const a of [-72,-36,36,72,0]){
    b.save();b.translate(64,56);b.rotate(a*Math.PI/180);b.scale(g,g);
    b.beginPath();b.moveTo(0,0);b.quadraticCurveTo(-8,-14,0,-30);b.quadraticCurveTo(8,-14,0,0);
    a===0?b.fill():b.stroke();b.restore();
  }
  for(let k=0;k<2;k++){const r=((t*10+k*14)%28);b.beginPath();b.ellipse(64,59,12+r,2+r/6,0,0,7);b.stroke()}
}

function oldDancer(t){
  clear();stars(t,18);
  const sw=Math.sin(t*2.2),bx=64+sw*1.5,lf=Math.sin(t*3)*1.5,rf=Math.sin(t*3+1.5)*2;
  b.beginPath();b.arc(bx,13,5,0,7);b.stroke();             // head
  b.beginPath();b.arc(bx,6.5,2.2,0,7);b.fill();            // hair bun
  dot(bx-2,13);dot(bx+2,13);dot(bx,9.5,.6);                // eyes + bindi
  L(bx,18,bx,22);L(bx-8,22,bx+8,22);                       // neck, shoulders
  L(bx-6,22,bx-5,31);L(bx+6,22,bx+5,31);L(bx-6,31,bx+6,31);// blouse + sash
  L(bx-8,22,bx-14,27,bx-14,19+lf);b.fillRect(bx-16,15+lf,4,4);          // abhaya hand
  L(bx+8,22,bx+18,20,bx+28,12+rf);L(bx+28,12+rf,bx+31,9+rf);L(bx+28,12+rf,bx+32,12+rf); // pataka hand
  for(let i=0;i<5;i++)L(bx-5+i*2.5,31,bx-14+i*6,52+(i%2));              // pleated drape
  L(bx-14,52,bx+10,52);
  L(bx-1,52,bx-1,60);L(bx-4,61,bx+2,61);                   // standing leg
  L(bx+6,47,bx+17,50,bx+15,56+lf);dot(bx+15,57+lf,1);      // raised leg
  b.beginPath();b.ellipse(bx-1,62,11,1.8,0,0,7);b.stroke();// lotus base
  for(let i=0;i<7;i++)b.fillRect(((rnd(i)*W+t*6)%W)|0,((rnd(i+7)*H+t*9*(.5+rnd(i+3)))%H)|0,1,1); // petals
}

/* ---------- girl image -> 1-bit (default = embedded reference, upload overrides) ---------- */
let bitsTall=null,bitsFit=null,BH=H,noise=new Float32Array(W*400).map((_,i)=>rnd(i+1)),srcImg=null;
function binarize(c,thr0=85){
  const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;
  const g=new Float32Array(w*h),o=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  const thr=thr0,bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){
    const i=y*w+xx;
    
    const gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1];
    const gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];
    o[i]=Math.hypot(gx,gy)>thr*2?1:0;
  }
  return o;
}
function processImage(){
  if(!srcImg)return;
  BH=Math.round(W*srcImg.height/srcImg.width);
  const t=document.createElement('canvas');t.width=W;t.height=BH;
  t.getContext('2d').drawImage(srcImg,0,0,W,BH);bitsTall=binarize(t);
  const f=document.createElement('canvas');f.width=W;f.height=H;const x=f.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const fw=srcImg.width/srcImg.height*H;
  x.drawImage(srcImg,(W-fw)/2,0,fw,H);bitsFit=binarize(f);
}
function drawBits(bits,w,off,p,sx=0){
  const id=b.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const si=((y+off)|0)*w+x-sx,v=x-sx>=0&&x-sx<w&&bits[si]&&noise[si]<p?255:0,k=(y*W+x)*4;
    id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255;
  }
  b.putImageData(id,0,0);
}
/* #photo: slow pan face -> hands -> feet, like an admiration reel */
function photo(t,age){
  if(!bitsTall)return oldDancer(t);
  const e=Math.min(1,age/7),s=e*e*(3-2*e);
  drawBits(bitsTall,W,s*(BH-H),Math.min(1,age/1.2));
}
/* #dancer: full figure, gentle sway, petals + stars */
function dancer(t,age){
  if(!bitsFit)return oldDancer(t);
  drawBits(bitsFit,W,0,Math.min(1,age/1.5),Math.round(Math.sin(t*1.6)*2));
  b.fillStyle='#fff';stars(t,16);
  for(let i=0;i<8;i++)b.fillRect(((rnd(i)*W+t*6)%W)|0,((rnd(i+7)*H+t*9*(.5+rnd(i+3)))%H)|0,1,1);
}

/* ---------- zoomed regions (eyes, face, mudra, legs...) from a sharper copy ---------- */
const REG={eyes:[135,60,120,60,60],face:[75,30,240,120,70],mudra:[0,148,180,90,80],leg:[295,535,210,105,80],feet:[195,762,140,70,80],legs:[175,600,160,80,80]};
const regBits={};let detImg=null;
function processRegions(){
  const k=detImg.width/505;
  for(const n in REG){
    const [x,y,w,h,thr]=REG[n],c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
    g.drawImage(detImg,x*k,y*k,w*k,h*k,0,0,W,H);
    regBits[n]=binarize(c,thr);
  }
}

/* ---------- lyric text ---------- */
function fit(s){let n=24;do{b.font=`bold ${n}px "Courier New",monospace`;if(b.measureText(s).width<=W-10)break}while(--n>7);return n}
function text(c,age){
  clear(c.inv);
  let lines=[c.x.toUpperCase()],s=fit(lines[0]);
  if(s<11&&lines[0].includes(' ')){
    const a=lines[0],m=a.indexOf(' ',a.length/2-3)>0?a.indexOf(' ',a.length/2-3):a.lastIndexOf(' ');
    lines=[a.slice(0,m),a.slice(m+1)];s=Math.min(fit(lines[0]),fit(lines[1]));
  }
  b.font=`bold ${s}px "Courier New",monospace`;b.textBaseline='middle';b.textAlign='left';
  let n=Math.ceil(age*22);
  lines.forEach((ln,i)=>{
    const x=(W-b.measureText(ln).width)/2,y=H/2+(i-(lines.length-1)/2)*(s+2);
    b.fillText(ln.slice(0,Math.max(0,n)),x,y);n-=ln.length;
  });
}

/* ---------- timeline: EDIT ME ---------- */
const AUDIO_SRC='pesamale.mp3';   // your audio file, same folder as this html
const LOOP_END=55;                // seconds before the visuals restart (no audio)
// [start second, '#scene' or 'LYRIC TEXT']
// scenes: #moon #lotus #stars #dancer #pan (slow scroll) and blinking close-ups: #eyes #face #mudra #legs #leg #feet
const CUES=[
 [0,'#moon'],
 [3.5,'MANAMOZHIVIL'],
 [4.4,'PESUM'],
 [5.6,'#eyes'],
 [9.2,'VENGADHO...'],
 [10.4,'#face'],
 [12.4,'KAANA'],
 [14,'THEDA'],
 [15.2,'#lotus'],
 [15.9,'#mudra'],
 [16.6,'VARADHO...'],
 [18.5,'UM PAARVAI'],
 [19.7,'PAARTHIRUNDHEN'],
 [20.9,'#dancer'],
 [23.5,'#legs'],
 [26.1,'#leg'],
 [28.7,'#feet'],
 [31.3,'#mudra'],
 [33.9,'#eyes'],
 [36.5,'#pan'],
 [39.1,'#stars']
];
let ti=0;
const cues=CUES.map(([t,x])=>{const art=x[0]==='#';return{t,x,art:art?x.slice(1):null,inv:!art&&(ti++%3===2)}});

// close-up that dissolves in, then blinks on/off for the whole cue
const zoom=n=>(t,age)=>{
  const bt=regBits[n];if(!bt)return oldDancer(t);
  const on=age<.3||(age%.9)<.65;
  if(on)drawBits(bt,W,0,Math.min(1,age/.3),0);
  else{clear();stars(t,10)}
};
const scenes={moon,lotus,dancer,pan:photo,stars:t=>{clear();stars(t,70)},
  eyes:zoom('eyes'),face:zoom('face'),mudra:zoom('mudra'),leg:zoom('leg'),feet:zoom('feet'),legs:zoom('legs')};

/* ---------- clock + audio ---------- */
const au=new Audio();let hasAu=false,mt=0,playing=false,last=performance.now();
au.src=AUDIO_SRC;au.loop=true;au.oncanplay=()=>{hasAu=true};
const now=()=>hasAu?au.currentTime:mt;
function toggle(){playing=!playing;if(hasAu)playing?au.play():au.pause()}
$('oled').onclick=toggle;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});

/* ---------- main loop ---------- */
function frame(ts){
  const dt=(ts-last)/1000;last=ts;
  if(playing&&!hasAu){mt+=dt;if(mt>LOOP_END)mt=0}
  const t=now();let i=-1;
  cues.forEach((c,k)=>{if(c.t<=t)i=k});
  if(!playing&&t===0)text({x:'TAP TO PLAY',inv:false},9);
  else{
    const c=cues[Math.max(0,i)],age=Math.max(0,t-c.t);
    if(c.art)(scenes[c.art]||dancer)(t,age);else text(c,age);
  }
  present();requestAnimationFrame(frame);
}
